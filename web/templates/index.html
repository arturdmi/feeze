<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* latin */
    @font-face {
      font-family: 'Carme';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/carme-v11-latin-regular.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* fira-mono-regular - latin */
    @font-face {
      font-family: 'Fira Mono';
      font-style: normal;
      font-weight: 400;
      src: local(''),
        url('/fonts/fira-mono-v9-latin-regular.woff2') format('woff2');
    }

    /*!
    * Font Awesome Free 5.15.3 by @fontawesome - https://fontawesome.com
    * License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License)
    */
    @font-face {
      font-family: 'Font Awesome 5 Free';
      font-style: normal;
      font-weight: 900;
      font-display: block;
      src: url("/fonts/fa-solid-900.woff2") format("woff2");
    }
  </style>
  <link rel="stylesheet" href="/style.css">

  <title>feeze</title>
</head>

<body>
  <div class="feeze_gui_blurred"></div>
  <header>
    <div class="wrapper">
      <div style="margin-right: 15px;">
        <a href="/" title="Feeze Home">
          <img src="/images/logo.svg" width="60" alt="Feeze Logo">
        </a>
      </div>
      <div id="loginStatus">
        <form class="d-flex justify-content-between flex-wrap" id="loginform" onSubmit="return mylogin()">
          <div>
            feeze.dev — The Feeze Scheduling Tracer
          </div>
          <div>
            <span id="status0">JavaScript seems to be disabled. Functionality is limited.</span>
          </div>
        </form>
      </div>
    </div>
  </header>
  <main>
    <table class="nav_bar" id="NAV_BAR">
      <tr>
        <th class="nav_el">
          <a href="/index" class="nav_el2">Home</a>
        </th>
        <th class="nav_el">
          <a href="/doc" class="nav_el2">Documentation</a>
        </th>
        <th class="nav_el">
          <a href="/downloads" class="nav_el2">Downloads</a>
        </th>
        <th class="nav_el">
          <a href="/res" class="nav_el2">Resources</a>
        </th>
        <th class="nav_el">
          <a href="/bugs" class="nav_el2">Bugs / Issues</a>
        </th>
        <th class="nav_el">
          <a href="/services" class="nav_el2">Services</a>
        </th>
        <th class="nav_el">
          <a href="/thanks" class="nav_el2">Thanks</a>
        </th>
      </tr>
    </table>
    <p></p>
    <div id="content" class="mymain">
      ##CONTENT##
    </div>
  </main>

  <script>
    const sessionId = '##SESSION_ID##';
    const loginHeader = `
        <form class="d-flex justify-content-between flex-wrap" id="loginform" onSubmit="return mylogin()">
          <div>
            feeze.dev — The Feeze Scheduler Tracer
          </div>
          <div class="d-flex justify-content-end flex-wrap gap-25">
            <div id="status0"></div>
            <div>
              <label for="login" class="visually-hidden">Login</label>
              <input type="text"     class="logintext" required="required" maxlength="256" minlength="1" id="login"    name="login"    rows="1" cols="20" placeholder="login"    autofocus="true" />
              <label for="password" class="visually-hidden">Password</label>
              <input type="password" class="logintext" required="required" maxlength="40"  minlength="8" id="password" name="password" rows="1" cols="20" placeholder="password" />
            </div>
            <div>
              <input type="submit" class="loginbutton" width="200px" height="20px" name="submitlogin" value="Log in"/>
              <a href="/register" class="loginbutton" width="200px" height="20px" name="register">Sign up</a>
            </div>
          </div>
        </form>
        `;
    const loggedInHeader = `
        <form class="d-flex justify-content-between flex-wrap" id="logoutform" onSubmit="return mylogout()">
          <div>
            feeze.dev — The Feeze Scheduler Tracer
          </div>
          <div>
            <span id="status0"></span>
            <input type="submit"   class="loginbutton" width="200px" height="20px" name="logout" value="Log out"/>
          </div>
        </form>
        `;
  </script>
  <script src="/main.js"></script>
</body>

</html>
